<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เครื่องคำนวณความลาดชัน</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpolygon points='4,40 44,40 44,10' fill='%231E90D6' stroke='%231E90D6' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, like a field sheet. Inputs on top, result block, then a to-scale triangle and common presets. */
:root {
  --bg: #eef3f6;
  --surface: #ffffff;
  --fg: #12202a;
  --muted: #566775;
  --line: #d3dde4;
  --accent: #0a6c98;
  --accent-soft: #dcedf5;
  --danger: #b3261e;
  --font-body: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171d;
    --surface: #15222a;
    --fg: #e5edf2;
    --muted: #93a6b3;
    --line: #26363f;
    --accent: #55bde6;
    --accent-soft: #1b3441;
    --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171d;
  --surface: #15222a;
  --fg: #e5edf2;
  --muted: #93a6b3;
  --line: #26363f;
  --accent: #55bde6;
  --accent-soft: #1b3441;
  --danger: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: 1.5rem; line-height: 1.3; margin: 0; font-weight: 600; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.9375rem; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--line); }
.seg button {
  font: inherit; font-size: 0.875rem; color: var(--muted);
  background: transparent; border: 0; border-radius: 5px; padding: 8px 6px; cursor: pointer; min-width: 0;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.seg button:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 0.875rem; color: var(--muted); font-weight: 500; }
.field input {
  width: 100%; font-family: var(--font-num); font-size: 1.5rem; font-weight: 500;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; min-width: 0;
}
.field input[aria-invalid="true"] { border-color: var(--danger); }
.hint { margin: 0; font-size: 0.8125rem; color: var(--muted); }
.err { margin: 0; font-size: 0.875rem; color: var(--danger); min-height: 1.4em; }

.result { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0; }
.big { font-family: var(--font-num); font-weight: 600; font-size: clamp(2.75rem, 14vw, 4rem); line-height: 1.05; color: var(--accent); margin: 2px 0 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.pair > div { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.pair .val { font-family: var(--font-num); font-size: 1.5rem; font-weight: 600; margin: 2px 0 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

figure { margin: 0; }
figure svg { width: 100%; height: auto; display: block; max-width: 100%; }
figcaption { font-size: 0.8125rem; color: var(--muted); margin-top: 4px; }
.tri-fill { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.ground { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
.dim { fill: var(--muted); font-family: var(--font-body); font-size: 12px; }
.dimv { fill: var(--fg); font-family: var(--font-num); font-size: 12px; font-weight: 500; }

.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 0.875rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.chip b { font-family: var(--font-num); font-weight: 600; }
.chip:hover { border-color: var(--accent); }
h2 { font-size: 1rem; margin: 0; font-weight: 600; }

.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 44px; height: 44px; flex: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><svg class="logo" viewBox="0 0 48 48" role="img" aria-label="โลโก้สามเหลี่ยมสีฟ้า"><polygon points="4,40 44,40 44,10" fill="#1E90D6" stroke="#1E90D6" stroke-width="3" stroke-linejoin="round"/></svg><h1>เครื่องคำนวณความลาดชัน</h1></div>
    <p class="sub">ใส่ความยาวและความสูง แล้วดูค่าเป็นเปอร์เซ็นต์ อัตราส่วน 1 ต่อเท่าไหร่ และองศา</p>
  </header>

  <section class="panel" aria-label="ข้อมูลนำเข้า">
    <div class="seg" role="group" aria-label="ความยาวที่วัด">
      <button type="button" id="mode-run" aria-pressed="true">วัดแนวราบ</button>
      <button type="button" id="mode-along" aria-pressed="false">วัดตามแนวลาด</button>
    </div>
    <div class="fields">
      <div class="field">
        <label for="len" id="len-label">ความยาว (ระยะราบ)</label>
        <input id="len" type="number" inputmode="decimal" step="any" min="0" value="3.6" autocomplete="off">
      </div>
      <div class="field">
        <label for="hgt">ความสูง</label>
        <input id="hgt" type="number" inputmode="decimal" step="any" min="0" value="0.3" autocomplete="off">
      </div>
    </div>
    <p class="hint">ใช้หน่วยเดียวกันทั้งสองช่อง เช่น เมตรทั้งคู่ หรือเซนติเมตรทั้งคู่</p>
    <p class="err" id="err" role="alert"></p>
  </section>

  <section class="panel result" aria-live="polite" aria-label="ผลลัพธ์">
    <div>
      <p class="eyebrow">ความลาดชัน</p>
      <p class="big" id="pct">–</p>
    </div>
    <div class="pair">
      <div>
        <p class="eyebrow">อัตราส่วน 1 ต่อ</p>
        <p class="val" id="ratio">–</p>
      </div>
      <div>
        <p class="eyebrow">มุมเอียง</p>
        <p class="val" id="deg">–</p>
      </div>
    </div>
    <figure>
      <svg id="tri" viewBox="0 0 360 190" role="img" aria-label="รูปสามเหลี่ยมแสดงความลาดตามสัดส่วนจริง"></svg>
      <figcaption>วาดตามสัดส่วนจริงของค่าที่ใส่</figcaption>
    </figure>
  </section>

  <section class="panel" aria-label="ค่าที่พบบ่อย">
    <h2>ลองค่าที่พบบ่อย</h2>
    <div class="presets" id="presets">
      <button type="button" class="chip" data-n="20"><b>1:20</b> · 5%</button>
      <button type="button" class="chip" data-n="12"><b>1:12</b> · ทางลาดรถเข็น</button>
      <button type="button" class="chip" data-n="8"><b>1:8</b> · 12.5%</button>
      <button type="button" class="chip" data-n="4"><b>1:4</b> · 25%</button>
    </div>
    <p class="hint">กดแล้วระบบใส่ความสูง 1 และความยาวตามอัตราส่วนให้ (แนวราบ)</p>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var lenEl = $('len'), hgtEl = $('hgt'), errEl = $('err');
  var pctEl = $('pct'), ratioEl = $('ratio'), degEl = $('deg'), svg = $('tri');
  var mode = 'run';

  function fmt(n, max) {
    return n.toLocaleString('en-US', { maximumFractionDigits: max, minimumFractionDigits: 0 });
  }

  function setOut(p, r, d) { pctEl.textContent = p; ratioEl.textContent = r; degEl.textContent = d; }

  function draw(run, rise, hyp, hypLabel) {
    var maxW = 290, maxH = 110, x0 = 22, y0 = 150;
    var s = Math.min(maxW / run, maxH / rise);
    var w = Math.max(run * s, 6), h = Math.max(rise * s, 2);
    var x1 = x0 + w, yTop = y0 - h;
    var out = '';
    out += '<line class="ground" x1="8" y1="' + y0 + '" x2="352" y2="' + y0 + '"/>';
    out += '<polygon class="tri-fill" points="' + x0 + ',' + y0 + ' ' + x1 + ',' + y0 + ' ' + x1 + ',' + yTop + '"/>';
    var baseLabel = mode === 'run' ? 'ความยาว ' : 'ระยะราบ ';
    out += '<text class="dim" x="' + (x0 + w / 2) + '" y="' + (y0 + 20) + '" text-anchor="middle">' + baseLabel + '<tspan class="dimv">' + fmt(run, 3) + '</tspan></text>';
    var rx = Math.min(x1 + 8, 300);
    out += '<text class="dim" x="' + rx + '" y="' + (y0 - h / 2 + 4) + '" text-anchor="start">สูง <tspan class="dimv">' + fmt(rise, 3) + '</tspan></text>';
    if (mode === 'along') {
      out += '<text class="dim" x="' + (x0 + w / 2 - 8) + '" y="' + (y0 - h / 2 - 8) + '" text-anchor="end">ความยาว <tspan class="dimv">' + fmt(hyp, 3) + '</tspan></text>';
    }
    svg.innerHTML = out;
  }

  function clearDraw() { svg.innerHTML = ''; }

  function calc() {
    var L = parseFloat(lenEl.value), H = parseFloat(hgtEl.value);
    lenEl.removeAttribute('aria-invalid'); hgtEl.removeAttribute('aria-invalid');
    errEl.textContent = '';

    if (!isFinite(L) || !isFinite(H)) { setOut('–', '–', '–'); clearDraw(); return; }
    if (L < 0 || H < 0) {
      errEl.textContent = 'ใส่ค่าตั้งแต่ 0 ขึ้นไป';
      if (L < 0) lenEl.setAttribute('aria-invalid', 'true');
      if (H < 0) hgtEl.setAttribute('aria-invalid', 'true');
      setOut('–', '–', '–'); clearDraw(); return;
    }

    var run = L;
    if (mode === 'along') {
      if (H > L) {
        errEl.textContent = 'ความยาวตามแนวลาดต้องไม่น้อยกว่าความสูง';
        lenEl.setAttribute('aria-invalid', 'true');
        setOut('–', '–', '–'); clearDraw(); return;
      }
      run = Math.sqrt(L * L - H * H);
    }

    if (H === 0) { setOut('0%', 'ราบ', '0°'); clearDraw(); return; }
    if (run === 0) { setOut('ลาดชันสุด', '0', '90°'); clearDraw(); return; }

    var pct = H / run * 100;
    var ratio = run / H;
    var deg = Math.atan(H / run) * 180 / Math.PI;
    setOut(fmt(pct, 2) + '%', '1 : ' + fmt(ratio, 2), fmt(deg, 2) + '°');
    draw(run, H, L, '');
  }

  function setMode(m) {
    mode = m;
    $('mode-run').setAttribute('aria-pressed', m === 'run');
    $('mode-along').setAttribute('aria-pressed', m === 'along');
    $('len-label').textContent = m === 'run' ? 'ความยาว (ระยะราบ)' : 'ความยาว (ตามแนวลาด)';
    calc();
  }

  $('mode-run').addEventListener('click', function () { setMode('run'); });
  $('mode-along').addEventListener('click', function () { setMode('along'); });
  lenEl.addEventListener('input', calc);
  hgtEl.addEventListener('input', calc);
  $('presets').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-n]');
    if (!b) return;
    hgtEl.value = '1';
    lenEl.value = b.getAttribute('data-n');
    setMode('run');
  });

  calc();
})();
</script>
</body>
</html>
